<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interaction log</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #F7F5F1; color: #2A2622; font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; background: #FCFBF9; border-bottom: 1px solid #E7E2DA; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; z-index: 2; }
  header h1 { font-size: 14px; margin: 0 12px 0 0; }
  input, select, button { font: inherit; padding: 4px 8px; border: 1px solid #D8CFC2; border-radius: 6px; background: #fff; color: inherit; }
  input:focus, select:focus { outline: none; border-color: #B0975A; }
  button { cursor: pointer; }
  button:hover { background: #F5F1EA; }
  .toggle { border-radius: 6px 0 0 6px; }
  .toggle + .toggle { border-radius: 0 6px 6px 0; border-left: none; }
  .toggle.on { background: #EDE4D2; color: #6B5433; font-weight: 600; }
  #summary { color: #8A8276; margin-left: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #EEE9E1; vertical-align: top; }
  th { position: sticky; top: 49px; background: #F7F5F1; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #8A8276; z-index: 1; }
  tr:hover td { background: #FCFBF9; }
  .src { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .src.user { background: #E7EDDC; color: #55613B; }
  .src.agent { background: #EDE4D2; color: #8A6D3B; }
  .src.system { background: #E4E2DE; color: #6B6256; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .muted { color: #A8A29E; }
  /* A block INSIDE the cell, with a hard width: a td's own max-width loses
     to the table's min-content sizing on long unbroken JSON, which shoved
     the delete column over the text. */
  .payload { width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .payload.open { white-space: pre-wrap; word-break: break-all; overflow: visible; width: auto; max-width: 640px; }
  td.slim { width: 28px; white-space: nowrap; }
  .lbl { color: #7C5C2E; background: #F3EAD7; border-radius: 5px; padding: 0 6px; cursor: pointer; }
  .lbl.empty { color: #C4BBAD; background: transparent; }
  .part { color: #3F5A52; background: #DCEAE4; border-radius: 5px; padding: 0 6px; cursor: pointer; font-weight: 600; }
  .part.empty { color: #C4BBAD; background: transparent; font-weight: 400; }
  .rowbtn { border: none; background: transparent; color: #A8A29E; padding: 2px 4px; }
  .rowbtn:hover { color: #9C5638; background: transparent; }
  .sess-row { cursor: pointer; }
  .count { font-weight: 600; }
  #sess-context { padding: 8px 16px; border-bottom: 1px solid #EEE9E1; background: #FCFBF9; display: flex; align-items: center; gap: 10px; }
  #sess-context[hidden] { display: none; }
  #empty, #s-empty, #tl-empty { padding: 40px; text-align: center; color: #A8A29E; }
  #tl-context { padding: 8px 16px; border-bottom: 1px solid #EEE9E1; background: #FCFBF9; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #tl-scroll { overflow-x: auto; padding: 8px 0 16px; }
  #tl-svg text { font: 10px ui-sans-serif, system-ui, sans-serif; fill: #8A8276; }
  #tl-svg .lane-label { font-size: 11px; font-weight: 600; fill: #6B6256; }
  .tl-key { display: inline-flex; align-items: center; gap: 5px; margin-right: 10px; font-size: 11px; color: #6B6256; }
  .tl-dot { width: 9px; height: 9px; border-radius: 999px; display: inline-block; }
  .lane-dot { width: 7px; height: 7px; border-radius: 999px; border: 1.5px solid; display: inline-block; margin-right: 7px; vertical-align: 1px; }
</style>
</head>
<body>
<header>
  <h1>Interaction log</h1>
  <button id="btn-sessions" class="toggle on">Sessions</button><button id="btn-events" class="toggle">Events</button>
  <span id="filters" style="display: none;">
    <input id="f-event" placeholder="event contains..." size="14" />
    <select id="f-source">
      <option value="">all sources</option>
      <option value="user">user</option>
      <option value="agent">agent</option>
      <option value="system">system</option>
    </select>
    <input id="f-session" placeholder="session id..." size="12" />
    <input id="f-participant" placeholder="participant..." size="10" />
    <select id="f-limit">
      <option>100</option>
      <option selected>200</option>
      <option>500</option>
      <option>1000</option>
    </select>
  </span>
  <button id="refresh">Refresh</button>
  <label><input type="checkbox" id="auto" /> auto 5s</label>
  <span id="summary"></span>
</header>

<section id="sessions-wrap">
  <table>
    <thead>
      <tr>
        <th>participant</th><th>session</th><th>events</th>
        <th>first</th><th>last</th><th></th>
      </tr>
    </thead>
    <tbody id="sess-rows"></tbody>
  </table>
  <div id="s-empty" hidden>No sessions yet.</div>
</section>

<section id="timeline-wrap" hidden>
  <div id="tl-context"></div>
  <div id="tl-scroll"><svg id="tl-svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="tl-empty" hidden>No events in this session.</div>
</section>

<section id="events-wrap" hidden>
  <div id="sess-context" hidden></div>
  <table>
    <thead>
      <tr>
        <th>id</th><th>time</th><th>event</th><th>source</th>
        <th>session</th>
        <th>proj</th><th>label</th><th>payload</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" hidden>No events match.</div>
</section>

<script>
const token = new URLSearchParams(location.search).get("token") || "";
const qs = (o) => Object.entries(o).filter(([,v]) => v !== "" && v != null)
  .map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join("&");
const el = (id) => document.getElementById(id);

let view = "sessions";
let tlSid = null;
function setView(v) {
  view = v;
  el("sessions-wrap").hidden = v !== "sessions";
  el("events-wrap").hidden = v !== "events";
  el("timeline-wrap").hidden = v !== "timeline";
  el("filters").style.display = v === "events" ? "contents" : "none";
  el("btn-sessions").classList.toggle("on", v === "sessions");
  el("btn-events").classList.toggle("on", v === "events");
  reload();
}
function reload() {
  if (view === "sessions") loadSessions();
  else if (view === "timeline") loadTimeline();
  else load();
}

function fmt(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString("en-CA").slice(5) + " " +
    d.toLocaleTimeString("en-GB", { hour12: false });
}

async function assignParticipant(sessionId, current) {
  const next = prompt(
    `Participant for session ${sessionId.slice(0, 8)}... (empty clears):`,
    current || "",
  );
  if (next === null) return false;
  await fetch(
    `/api/log/session/${encodeURIComponent(sessionId)}/participant?${qs({ token })}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ participant: next }),
    },
  );
  return true;
}

function openSession(sid) {
  navigate("events", sid || "");
}

function updateSessionContext(sidFilter, rows) {
  const strip = el("sess-context");
  if (!sidFilter) { strip.hidden = true; strip.innerHTML = ""; return; }
  const fullSid = (rows[0] && rows[0].chat_session) || sidFilter;
  const participant = rows[0] ? rows[0].participant : null;
  strip.innerHTML = "";
  const sidSpan = document.createElement("span");
  sidSpan.className = "mono muted";
  sidSpan.textContent = "session " + fullSid.slice(0, 8);
  const pb = document.createElement("span");
  pb.className = "part" + (participant ? "" : " empty");
  pb.textContent = participant || "+ assign";
  pb.title = "Assign this whole session to a participant (empty clears)";
  pb.onclick = async () => {
    if (await assignParticipant(fullSid, participant)) load();
  };
  strip.appendChild(sidSpan);
  strip.appendChild(pb);
  // Mirror of the timeline's "table view" button, so the two views of one
  // session link both ways.
  const tlBtn = document.createElement("button");
  tlBtn.textContent = "timeline";
  tlBtn.onclick = () => navigate("timeline", fullSid);
  strip.appendChild(tlBtn);
  strip.appendChild(exportButton(fullSid));
  strip.hidden = false;
}

/* One-click research bundle: events + distilled transcript + participant
   + study mode, downloaded as a JSON file named after the session. */
function exportButton(sid) {
  const b = document.createElement("button");
  b.textContent = "export JSON";
  b.onclick = async () => {
    b.disabled = true;
    try {
      const res = await fetch(
        `/api/log/session/${encodeURIComponent(sid)}/export?${qs({ token })}`,
      );
      const body = await res.json();
      if (!body.success) { alert(body.error || "export failed"); return; }
      const data = body.data;
      const name = `session-${data.session.slice(0, 8)}${
        data.participant ? "-" + data.participant : ""
      }.json`;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(
        new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }),
      );
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    } finally {
      b.disabled = false;
    }
  };
  return b;
}

async function loadSessions() {
  const res = await fetch(`/api/log/sessions?${qs({ token })}`);
  const body = await res.json();
  if (!body.success) { el("summary").textContent = body.error || "error"; return; }
  const rows = body.data;
  const tbody = el("sess-rows");
  tbody.innerHTML = "";
  el("s-empty").hidden = rows.length > 0;
  let total = 0;
  const named = new Set();
  for (const s of rows) {
    total += s.events;
    if (s.participant) named.add(s.participant);
    const sid = s.chat_session;
    const tr = document.createElement("tr");
    tr.className = "sess-row";

    const pTd = document.createElement("td");
    const pb = document.createElement("span");
    pb.className = "part" + (s.participant ? "" : " empty");
    pb.textContent = s.participant || "+ assign";
    pb.title = "Assign this session to a participant (empty clears)";
    pb.onclick = async (e) => {
      e.stopPropagation();
      if (!sid) { alert("These rows have no session id."); return; }
      if (await assignParticipant(sid, s.participant)) loadSessions();
    };
    pTd.appendChild(pb);
    tr.appendChild(pTd);

    tr.appendChild(td(sid ? sid.slice(0, 8) : "(no session)", "mono muted"));
    tr.appendChild(td(String(s.events), "count"));
    tr.appendChild(td(fmt(s.first_ts), "mono"));
    tr.appendChild(td(fmt(s.last_ts), "mono"));

    const delTd = document.createElement("td");
    const tlBtn = document.createElement("button");
    tlBtn.className = "rowbtn";
    // Static literal, no user data: a mini dot-strip glyph (the ▤ glyph
    // rendered as an odd striped box on macOS).
    tlBtn.innerHTML =
      '<svg width="15" height="12" viewBox="0 0 15 12" aria-hidden="true">' +
      '<line x1="1" y1="10" x2="14" y2="10" stroke="currentColor" stroke-width="1.2"/>' +
      '<circle cx="3.5" cy="3.5" r="1.7" fill="currentColor"/>' +
      '<circle cx="7.5" cy="6.5" r="1.7" fill="currentColor"/>' +
      '<circle cx="11.5" cy="3.5" r="1.7" fill="currentColor"/></svg>';
    tlBtn.title = "Timeline strip of this session's events";
    tlBtn.onclick = (e) => {
      e.stopPropagation();
      if (!sid) { alert("These rows have no session id."); return; }
      navigate("timeline", sid);
    };
    delTd.appendChild(tlBtn);
    const del = document.createElement("button");
    del.className = "rowbtn";
    del.textContent = "✕";
    del.title = "Permanently delete every event of this session";
    del.onclick = async (e) => {
      e.stopPropagation();
      if (!sid) return;
      const key = sid.slice(0, 8);
      const typed = prompt(
        `This PERMANENTLY deletes all ${s.events} events of session ${key}... and cannot be undone.\nType ${key} to confirm:`,
      );
      if (typed === null) return;
      if (typed.trim() !== key) { alert("Not deleted: text did not match."); return; }
      await fetch(`/api/log/session/${encodeURIComponent(sid)}?${qs({ token })}`, {
        method: "DELETE",
      });
      loadSessions();
    };
    delTd.appendChild(del);
    tr.appendChild(delTd);

    tr.onclick = () => openSession(sid);
    tbody.appendChild(tr);
  }
  el("summary").textContent =
    `${rows.length} sessions · ${total} events` +
    (named.size ? ` · ${named.size} participant${named.size > 1 ? "s" : ""}` : "");
}

async function load() {
  const params = {
    event: el("f-event").value.trim(),
    source: el("f-source").value,
    session: el("f-session").value.trim(),
    participant: el("f-participant").value.trim(),
    limit: el("f-limit").value,
    token,
  };
  const res = await fetch(`/api/log/query?${qs(params)}`);
  const body = await res.json();
  if (!body.success) { el("summary").textContent = body.error || "error"; return; }
  updateSessionContext(params.session, body.data);
  render(body.data);
}

function render(rows) {
  const tbody = el("rows");
  tbody.innerHTML = "";
  el("empty").hidden = rows.length > 0;
  const counts = { user: 0, agent: 0, system: 0 };
  for (const r of rows) {
    counts[r.source] = (counts[r.source] || 0) + 1;
    const tr = document.createElement("tr");

    const sess = r.chat_session ? r.chat_session.slice(0, 8) : "";

    tr.appendChild(td(String(r.id), "mono muted"));
    tr.appendChild(td(fmt(r.ts), "mono"));
    // Lane dot before the event name: the same colour and fill the
    // timeline uses, so a row in the table and a dot in the strip are
    // recognisably the same thing.
    const evTd = document.createElement("td");
    evTd.className = "mono";
    const lane = LANES.find((l) => l.key === laneOf(r)) || LANES[3];
    const hollow = isHollow(r);
    const dot = document.createElement("span");
    dot.className = "lane-dot";
    dot.style.background = hollow ? "transparent" : lane.color;
    dot.style.borderColor = lane.color;
    dot.title = lane.label + (hollow ? " (cancel / close)" : "");
    evTd.appendChild(dot);
    evTd.appendChild(document.createTextNode(r.event));
    tr.appendChild(evTd);
    // The source value arrives from an unauthenticated ingest endpoint,
    // so it must never touch innerHTML (stored XSS). textContent for the
    // value; the styling class only when it is one of the known sources.
    const srcTd = document.createElement("td");
    const srcSpan = document.createElement("span");
    srcSpan.className =
      "src" + (["user", "agent", "system"].includes(r.source) ? " " + r.source : "");
    srcSpan.textContent = r.source;
    srcTd.appendChild(srcSpan);
    tr.appendChild(srcTd);

    tr.appendChild(td(sess, "mono muted"));
    tr.appendChild(td(r.project_key == null ? "" : String(r.project_key), "muted"));

    const lblTd = document.createElement("td");
    const lbl = document.createElement("span");
    lbl.className = "lbl" + (r.label ? "" : " empty");
    lbl.textContent = r.label || "+ label";
    lbl.title = "Click to set or clear the label";
    lbl.onclick = async () => {
      const next = prompt("Label for row " + r.id + " (empty clears):", r.label || "");
      if (next === null) return;
      await fetch(`/api/log/${r.id}/label?${qs({ token })}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ label: next }),
      });
      load();
    };
    lblTd.appendChild(lbl);
    tr.appendChild(lblTd);

    const payTd = document.createElement("td");
    const pv = document.createElement("div");
    pv.className = "payload mono";
    pv.textContent = JSON.stringify(r.payload);
    pv.title = "Click to expand";
    pv.onclick = () => pv.classList.toggle("open");
    payTd.appendChild(pv);
    tr.appendChild(payTd);

    const delTd = document.createElement("td");
    delTd.className = "slim";
    const del = document.createElement("button");
    del.className = "rowbtn";
    del.textContent = "✕";
    del.title = "Permanently delete this row";
    del.onclick = async () => {
      if (!confirm(`Permanently delete row ${r.id} (${r.event})? This cannot be undone.`)) return;
      await fetch(`/api/log/${r.id}?${qs({ token })}`, { method: "DELETE" });
      load();
    };
    delTd.appendChild(del);
    tr.appendChild(delTd);

    tbody.appendChild(tr);
  }
  const parts = new Set(rows.filter((r) => r.participant).map((r) => r.participant));
  el("summary").textContent =
    `${rows.length} rows shown. user ${counts.user || 0} / agent ${counts.agent || 0} / system ${counts.system || 0}` +
    (parts.size ? ` · ${parts.size} participant${parts.size > 1 ? "s" : ""}` : "");
}

function td(text, cls) {
  const c = document.createElement("td");
  if (cls) c.className = cls;
  c.textContent = text;
  return c;
}

/* ---- Timeline strip -----------------------------------------------------
   A per-session sequence plot in the spirit of interaction-strip figures:
   one row per lane, one dot per event, time on x. The lane mapping lives in
   EVENT_LANE below and is EXPECTED to be revised as the analysis matures;
   events it does not know fall back to a lane by source, so new
   instrumentation shows up without touching this file. Cancel-like events
   render hollow. Vertical rules mark turn-complete boundaries. */
const LANES = [
  { key: "prompt",  label: "Prompt",     color: "#9C5638" },
  { key: "explore", label: "Explore",    color: "#3F6B63" },
  { key: "edit",    label: "Edit move",  color: "#5B6B9C" },
  { key: "other",   label: "Other user", color: "#8A8276" },
  { key: "agent",   label: "Agent",      color: "#B0975A" },
  { key: "system",  label: "System",     color: "#C4BBAD" },
];
const EVENT_LANE = {
  "chat-send": "prompt", "gate-describe": "prompt", "card-pick": "prompt",
  "detail-apply": "prompt", "context-drop": "prompt",
  // Onboarding and intent-revision are setup acts, not conversation
  // submissions; the Prompt lane stays strictly "text that reached the
  // agent conversation".
  "survey-submit": "other", "survey-revise": "other",
  "node-click": "explore", "bubble-open": "explore", "lens-open": "explore",
  "lens-close": "explore", "pane-click": "explore",
  "tracker-toggle": "explore", "trace-step": "explore",
  "trace-clear": "explore", "focus-mode": "explore",
  "scheme-switch": "explore", "scheme-generate": "explore",
  "panel-detail-click": "explore", "intent-chip-toggle": "explore",
  "block-drag": "explore",
  "arrow-draw": "edit", "block-add": "edit", "block-actions": "edit",
  "block-rename": "edit", "gate-suggest": "edit", "gate-cancel": "edit",
  "card-cancel": "edit", "detail-preview": "edit", "detail-cancel": "edit",
  "promote": "edit", "unpromote": "edit", "diagram-retry": "edit",
  "intent-edit-open": "other", "intent-edit-cancel": "other",
};
function laneOf(r) {
  const mapped = EVENT_LANE[r.event];
  if (mapped) return mapped;
  if (r.source === "agent") return "agent";
  if (r.source === "system") return "system";
  return "other";
}
function isHollow(r) {
  if (/cancel|clear|close/.test(r.event)) return true;
  const p = r.payload || {};
  if (r.event === "focus-mode" && p.on === false) return true;
  if (r.event === "tracker-toggle" && p.open === false) return true;
  // A pane click that dismissed something is the closing half of a pair
  // (fan opened by node-click, trace opened by trace-step, ...); the same
  // goes for a node re-click whose outcome closed its fan.
  if (typeof p.outcome === "string" && p.outcome.includes("close")) return true;
  if (typeof p.closed === "string" && p.closed !== "none") return true;
  return false;
}
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(name, attrs) {
  const n = document.createElementNS(SVGNS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
}

async function loadTimeline() {
  if (!tlSid) { navigate("sessions"); return; }
  const res = await fetch(
    `/api/log/query?${qs({ session: tlSid, limit: 5000, token })}`,
  );
  const body = await res.json();
  if (!body.success) { el("summary").textContent = body.error || "error"; return; }
  // Query returns newest first; the strip reads left to right in time.
  const rows = body.data.slice().reverse();
  renderTimeline(rows);
}

function renderTimeline(rows) {
  const svg = el("tl-svg");
  svg.replaceChildren();
  el("tl-empty").hidden = rows.length > 0;

  const strip = el("tl-context");
  strip.replaceChildren();
  const sidSpan = document.createElement("span");
  sidSpan.className = "mono muted";
  sidSpan.textContent = "session " + tlSid.slice(0, 8);
  strip.appendChild(sidSpan);
  const participant = rows.length ? rows[rows.length - 1].participant : null;
  if (participant) {
    const pb = document.createElement("span");
    pb.className = "part";
    pb.textContent = participant;
    strip.appendChild(pb);
  }
  const evBtn = document.createElement("button");
  evBtn.textContent = "table view";
  evBtn.onclick = () => navigate("events", tlSid);
  strip.appendChild(evBtn);
  strip.appendChild(exportButton(tlSid));
  for (const lane of LANES) {
    const k = document.createElement("span");
    k.className = "tl-key";
    const dot = document.createElement("span");
    dot.className = "tl-dot";
    dot.style.background = lane.color;
    k.appendChild(dot);
    k.appendChild(document.createTextNode(lane.label));
    strip.appendChild(k);
  }
  const hollowKey = document.createElement("span");
  hollowKey.className = "tl-key";
  const hd = document.createElement("span");
  hd.className = "tl-dot";
  hd.style.background = "#fff";
  hd.style.border = "2px solid #8A8276";
  hollowKey.appendChild(hd);
  hollowKey.appendChild(document.createTextNode("cancel / close"));
  strip.appendChild(hollowKey);
  if (rows.length === 0) return;

  const t0 = rows[0].ts;
  const t1 = rows[rows.length - 1].ts;
  const dur = Math.max(1000, t1 - t0);
  const LEFT = 92, TOP = 18, ROW = 34, RIGHT = 30;
  // Wide enough that a dense minute does not smear into one blob, capped so
  // an hour-long session stays scrollable rather than absurd.
  const plotW = Math.max(680, Math.min(6000, Math.round(dur / 1000) * 6));
  const H = TOP + LANES.length * ROW + 28;
  const W = LEFT + plotW + RIGHT;
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const x = (ts) => LEFT + ((ts - t0) / dur) * plotW;
  const laneY = {};
  LANES.forEach((l, i) => { laneY[l.key] = TOP + i * ROW + ROW / 2; });

  for (const [i, lane] of LANES.entries()) {
    const y = TOP + i * ROW;
    if (i % 2 === 1) {
      svg.appendChild(svgEl("rect", {
        x: 0, y, width: W, height: ROW, fill: "#F1EEE8",
      }));
    }
    const label = svgEl("text", { x: 8, y: y + ROW / 2 + 4, class: "lane-label" });
    label.textContent = lane.label;
    svg.appendChild(label);
  }

  // Time ticks at a step that yields a readable count.
  const steps = [10e3, 30e3, 60e3, 120e3, 300e3, 600e3, 1800e3, 3600e3];
  const step = steps.find((s) => dur / s <= 14) || steps[steps.length - 1];
  for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) {
    svg.appendChild(svgEl("line", {
      x1: x(t), y1: TOP, x2: x(t), y2: TOP + LANES.length * ROW,
      stroke: "#E3DED4", "stroke-width": 1,
    }));
    const tick = svgEl("text", {
      x: x(t), y: TOP + LANES.length * ROW + 16, "text-anchor": "middle",
    });
    tick.textContent = new Date(t).toLocaleTimeString("en-GB", { hour12: false });
    svg.appendChild(tick);
  }

  // Turn boundaries: a completed agent turn is the natural column break
  // when reading the strip as prompt, actions, response episodes.
  for (const r of rows) {
    if (r.event !== "turn-complete") continue;
    svg.appendChild(svgEl("line", {
      x1: x(r.ts), y1: TOP - 4, x2: x(r.ts), y2: TOP + LANES.length * ROW + 4,
      stroke: "#C9B58E", "stroke-width": 1, "stroke-dasharray": "3 3",
    }));
  }

  for (const r of rows) {
    const lane = LANES.find((l) => l.key === laneOf(r)) || LANES[3];
    const hollow = isHollow(r);
    const dot = svgEl("circle", {
      cx: x(r.ts).toFixed(1), cy: laneY[lane.key], r: 4.5,
      fill: hollow ? "#FCFBF9" : lane.color,
      stroke: lane.color, "stroke-width": hollow ? 2 : 0,
    });
    const tip = document.createElementNS(SVGNS, "title");
    tip.textContent =
      `${fmt(r.ts)}  ${r.event} (${r.source})\n` + JSON.stringify(r.payload);
    dot.appendChild(tip);
    svg.appendChild(dot);
  }
  el("summary").textContent =
    `${rows.length} events · ${Math.round(dur / 60000)} min`;
}

function navigate(v, sid) {
  if (v === "events") {
    if (sid !== undefined) el("f-session").value = sid || "";
    const cur = el("f-session").value.trim();
    history.pushState(
      { view: v },
      "",
      cur ? `#events=${encodeURIComponent(cur)}` : "#events",
    );
  } else if (v === "timeline") {
    tlSid = sid || tlSid;
    history.pushState(
      { view: v },
      "",
      `#timeline=${encodeURIComponent(tlSid || "")}`,
    );
  } else {
    history.pushState({ view: v }, "", location.pathname + location.search);
  }
  setView(v);
}
function initFromLocation() {
  const me = location.hash.match(/^#events(?:=(.*))?$/);
  const mt = location.hash.match(/^#timeline=(.+)$/);
  if (mt) {
    tlSid = decodeURIComponent(mt[1]);
    setView("timeline");
  } else if (me) {
    if (me[1]) el("f-session").value = decodeURIComponent(me[1]);
    setView("events");
  } else {
    setView("sessions");
  }
}
window.addEventListener("popstate", initFromLocation);
el("btn-sessions").onclick = () => navigate("sessions");
el("btn-events").onclick = () => navigate("events");
el("refresh").onclick = reload;
for (const id of ["f-event", "f-source", "f-session", "f-participant", "f-limit"]) {
  el(id).addEventListener("change", load);
}
for (const id of ["f-event", "f-session", "f-participant"]) {
  el(id).addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
}
let timer = null;
el("auto").onchange = (e) => {
  if (e.target.checked) timer = setInterval(reload, 5000);
  else clearInterval(timer);
};
initFromLocation();
</script>
</body>
</html>
