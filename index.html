<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Representation Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // The app's UI is authored light-only, but the template's dark
      // tokens still drive borders, body text and chat surfaces. On a
      // dark-mode machine the old follow-the-OS logic rendered a broken
      // half-dark hybrid (near-black borders, washed-out chat text), so
      // the light theme is forced unconditionally before React mounts.
      document.documentElement.classList.add("theme-light");
      document.documentElement.style.colorScheme = "light";
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
